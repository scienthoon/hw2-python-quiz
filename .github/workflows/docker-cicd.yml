name: Docker CI and zero-downtime CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hw3-docker-release
  cancel-in-progress: false

jobs:
  build:
    name: Test, build and push Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check registry settings
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$HUB_USER" || { echo 'Set DOCKERHUB_USERNAME repository secret'; exit 1; }
          test -n "$HUB_TOKEN" || { echo 'Set DOCKERHUB_TOKEN repository secret'; exit 1; }
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and test the container
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: quiz-ci:${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}
      - name: Check running container and real grading API
        run: |
          docker run -d --rm --name hw3-ci-smoke -p 127.0.0.1:18081:8080 quiz-ci:${{ github.sha }}
          node scripts/smoke.mjs
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f hw3-ci-smoke || true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push AMD64 and ARM64 images to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hw3-python-quiz:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hw3-python-quiz:latest
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull image and switch local service
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, hw3-quiz]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Blue-green deployment and continuous grading requests
        env:
          HW3_DEPLOY_ROOT: ${{ runner.workspace }}/_hw3_state
          QUIZ_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hw3-python-quiz:${{ github.sha }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/deploy.mjs --image "$QUIZ_IMAGE" --commit "$RELEASE_COMMIT"
      - name: Upload actual availability measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: availability-${{ github.sha }}
          path: ${{ runner.workspace }}/_hw3_state/evidence/
